<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naiki AI</title>
<meta name="description" content="Naiki AI: teman karier siswa SMA. AI companion, asesmen minat RIASEC, roadmap karier otomatis, dashboard Guru BK, mentoring, progress tracker, dan direktori karier.">
<meta property="og:title" content="Naiki AI">
<meta property="og:description" content="Teman karier siswa SMA: asesmen minat, roadmap karier, dan AI companion dalam satu alur.">
<meta property="og:image" content="/logo.png">
<meta name="theme-color" content="#5E2EC3">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a sticky rail that lists the 7-step student journey in order, beside one working canvas; under 860px the rail folds into a top bar with scrollable step chips. */
:root{
  --bg:#F4F3FA; --surface:#FFFFFF; --sunk:#F0EEF8; --ink:#1A1530; --muted:#625C7B; --line:#E2DEEE;
  --violet:#5E2EC3; --blue:#1C59B4; --soft:#EDE7FC; --soft-blue:#E3EDFC; --on-accent:#FFFFFF;
  --good:#16794B; --good-soft:#E1F3E9; --warn:#9A5F0C; --warn-soft:#FBEFD9; --crit:#BC2B42; --crit-soft:#FBE5E8;
  --scrim:rgba(20,15,36,.45); --shadow:0 1px 2px rgba(26,21,48,.05), 0 10px 28px -14px rgba(26,21,48,.22);
  --brand-a:#6A35C8; --brand-b:#2950B8;
  --call-bg:#0E0A19; --call-tile:#1C1630; --call-ink:#F3F0FB; --call-muted:#A59FC0; --call-end:#E0475E;
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-s:8px; --r-m:14px; --r-l:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#100D1A; --surface:#191527; --sunk:#14111F; --ink:#EEEAF8; --muted:#A49EBC; --line:#2C2640;
  --violet:#A78DFF; --blue:#7AA8F5; --soft:#251D3F; --soft-blue:#172540; --on-accent:#140F24;
  --good:#5FD39A; --good-soft:#132A1F; --warn:#F2B55B; --warn-soft:#2D2312; --crit:#FF7D8F; --crit-soft:#341822;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#100D1A; --surface:#191527; --sunk:#14111F; --ink:#EEEAF8; --muted:#A49EBC; --line:#2C2640;
  --violet:#A78DFF; --blue:#7AA8F5; --soft:#251D3F; --soft-blue:#172540; --on-accent:#140F24;
  --good:#5FD39A; --good-soft:#132A1F; --warn:#F2B55B; --warn-soft:#2D2312; --crit:#FF7D8F; --crit-soft:#341822;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark }

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;
  padding-block:22px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:16px}
.brand{display:flex;align-items:center;gap:10px;padding-inline:6px}
.brand img{width:38px;height:auto;display:block}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:800;letter-spacing:-.02em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:.74rem}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;position:relative}
.nav::before{content:"";position:absolute;left:20px;top:18px;bottom:18px;width:2px;background:var(--line)}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;text-decoration:none;color:var(--ink)}
.nav a:hover{background:var(--sunk)}
.nav .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;font-weight:600;
  background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.nav .t{display:flex;flex-direction:column;min-width:0}
.nav .t span{font-weight:600;font-size:.9rem;line-height:1.25}
.nav .t small{color:var(--muted);font-size:.74rem}
.nav a[aria-current="page"]{background:var(--soft)}
.nav a[aria-current="page"] .n{background:var(--violet);border-color:var(--violet);color:var(--on-accent)}
.nav a[aria-current="page"] .t span{color:var(--violet)}
.tag-guru{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);background:var(--soft-blue);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--muted)}
.ai-status{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)} .dot.wait{background:var(--warn)}

.main{min-width:0;padding-block:28px 64px;padding-left:36px;padding-right:max(36px, env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.top .lead{max-width:62ch;color:var(--muted);margin-top:6px}
.who{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--soft);color:var(--violet);flex:none}
.av.grad{background:linear-gradient(135deg,var(--brand-a),var(--brand-b));color:#fff}
.who b{display:block;font-size:.86rem;line-height:1.2}
.who small{color:var(--muted);font-size:.74rem}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;min-width:0}
.card.raised{box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 320px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:9px 16px;font-weight:600;font-size:.9rem;border:1px solid transparent;background:none;white-space:nowrap}
.btn-p{background:var(--violet);color:var(--on-accent)}
.btn-p:hover{filter:brightness(1.08)}
.btn-g{background:var(--surface);border-color:var(--line)}
.btn-g:hover{background:var(--sunk)}
.btn-s{padding:6px 12px;font-size:.82rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--violet);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--soft-blue);color:var(--blue)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.code{display:inline-flex;gap:3px}
.code i{font-style:normal;font-family:var(--f-mono);font-weight:600;font-size:.74rem;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:var(--soft);color:var(--violet)}
.note{font-size:.8rem;color:var(--muted)}
.example-flag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 8px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--violet)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.84rem;font-weight:500}
.chip:hover{border-color:var(--violet)}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on-accent)}

/* 1. Companion */
.chat{display:flex;flex-direction:column;padding:0;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.chat-h .av{width:40px;height:40px;background:var(--soft)}
.chat-h .av img{width:26px}
.msgs{height:clamp(340px,56vh,600px);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--sunk)}
.msg{max-width:min(78%,560px);padding:11px 15px;border-radius:16px;line-height:1.55;font-size:.92rem;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--violet);color:var(--on-accent);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg ul{margin:6px 0;padding-left:20px}
.msg p+p,.msg p+ul,.msg ul+p{margin-top:8px}
.msg .err{display:block;margin-top:6px;font-size:.78rem;color:var(--crit)}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:.85rem}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.composer form{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);min-height:46px;max-height:140px}
.composer textarea:focus{outline:2px solid var(--violet);outline-offset:0;border-color:transparent}
.ctx dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:.86rem}
.ctx dt{color:var(--muted)} .ctx dd{margin:0;font-weight:600;text-align:right}

/* 2. Assessment */
.hexwrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:center}
.hex svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.big-code{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;letter-spacing:.02em;
  background:linear-gradient(135deg,var(--brand-a),var(--brand-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:120px minmax(0,1fr) 42px;gap:12px;align-items:center;font-size:.86rem}
.row b{font-weight:600}
.reco{display:flex;flex-direction:column;gap:10px}
.reco-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
.reco-item .grow{flex:1;min-width:0}
.pct{font-family:var(--f-mono);font-weight:600;font-size:.95rem;color:var(--violet)}
.quiz{max-width:720px;margin:0 auto;width:100%}
.quiz-q{font-family:var(--f-display);font-size:clamp(1.3rem,1.1rem + .8vw,1.7rem);font-weight:700;margin:18px 0 22px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:500}
.opt:hover{border-color:var(--violet)}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"]{border-color:var(--violet);background:var(--soft)}
.opt[aria-checked="true"] .radio{border-color:var(--violet)}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--violet)}
.quiz-nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px}

/* 3. Roadmap */
.target{display:flex;flex-wrap:wrap;align-items:center;gap:18px;justify-content:space-between}
.target .grow{flex:1;min-width:220px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ph{display:grid;grid-template-columns:34px minmax(0,1fr);gap:16px;position:relative;padding-bottom:22px}
.ph:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.ph.done:not(:last-child)::before{background:var(--violet)}
.node{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted);position:relative;z-index:1}
.ph.done .node{background:var(--violet);border-color:var(--violet);color:var(--on-accent)}
.ph.now .node{border-color:var(--violet);color:var(--violet);box-shadow:0 0 0 5px var(--soft)}
.ph-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px}
.ph.now .ph-body{border-color:var(--violet)}
.ph-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.task{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:.9rem;cursor:pointer}
.task input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--violet);flex:none}
.task.is-done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}

/* 4. Guru BK */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px}
.stat .v{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.stat.crit .v{color:var(--crit)}
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px 12px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.alert::before{content:"";align-self:stretch;background:var(--muted)}
.alert.crit::before{background:var(--crit)}.alert.warn::before{background:var(--warn)}.alert.info::before{background:var(--blue)}
.alert p{font-size:.88rem}
.tbl-wrap{overflow-x:auto;margin:0 -20px -20px;padding:0 20px 8px}
table{width:100%;border-collapse:collapse;font-size:.87rem;min-width:760px}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .bar{width:90px;display:inline-block;vertical-align:middle;margin-right:8px}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem}

/* 5. Mentoring */
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-l);padding:22px}
.next .when{font-family:var(--f-display);font-size:1.35rem;font-weight:700;margin:4px 0}
.mentors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mentor{display:flex;flex-direction:column;gap:10px}
.mentor-h{display:flex;gap:12px;align-items:center}
.mentor-h .av{width:44px;height:44px}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:.8rem;font-family:var(--f-mono)}
.slot[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on-accent)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.list li:last-child{border-bottom:0}
textarea.notes{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);resize:vertical;line-height:1.6}

/* 6. Progress */
.lvl{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .in b{font-family:var(--f-display);font-size:2.2rem;font-weight:800;line-height:1;display:block}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1;min-width:220px}
.mini{background:var(--sunk);border-radius:12px;padding:10px 12px}
.mini b{font-family:var(--f-display);font-size:1.3rem;display:block;font-variant-numeric:tabular-nums}
.mini small{color:var(--muted);font-size:.78rem}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 8px;border:1px solid var(--line);border-radius:12px}
.badge .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand-a),var(--brand-b));color:#fff}
.badge.locked .ic{background:var(--sunk);color:var(--muted)}
.badge b{font-size:.84rem;line-height:1.25}
.badge small{font-size:.74rem;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}

/* 7. Directory */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 38px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.ccard:hover{border-color:var(--violet)}
.ccard .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ccard .meta{font-size:.82rem;color:var(--muted)}
.ccard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:.82rem}
.is-target{outline:2px solid var(--violet);outline-offset:-1px}
.drawer-bg{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:41;overflow-y:auto;box-shadow:var(--shadow);
  padding-top:max(22px, env(safe-area-inset-top,0px));padding-bottom:max(22px, env(safe-area-inset-bottom,0px));padding-left:24px;padding-right:max(24px, env(safe-area-inset-right,0px));

.drawer dl{margin:0;display:flex;flex-direction:column;gap:12px}
.drawer dt{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.drawer dd{margin:2px 0 0}

/* Call */
.call{position:fixed;inset:0;z-index:50;background:var(--call-bg);color:var(--call-ink);display:flex;flex-direction:column;
  padding-top:max(18px, env(safe-area-inset-top,0px));padding-bottom:max(18px, env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));gap:14px}
.call-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.call-h small{color:var(--call-muted)}
.tiles{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-height:0}
.tile{background:var(--call-tile);border-radius:18px;display:grid;place-items:center;position:relative;min-height:160px}
.tile .av{width:84px;height:84px;font-size:1.6rem}
.tile span{position:absolute;left:12px;bottom:10px;font-size:.82rem;color:var(--call-muted)}
.call-ctl{display:flex;justify-content:center;gap:12px}
.cbtn{width:52px;height:52px;border-radius:50%;border:0;background:var(--call-tile);color:var(--call-ink);display:grid;place-items:center}
.cbtn[aria-pressed="true"]{background:var(--call-ink);color:var(--call-bg)}
.cbtn.end{background:var(--call-end);color:#fff;width:64px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:12px;font-size:.88rem;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:1060px){
  .g-side{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}

  .main{padding-block:20px 56px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .g-2,.mentors,.hexwrap{grid-template-columns:minmax(0,1fr)}

function md(s){
  const lines = esc(s).split("\n"); let out = "", inList = false;
  const inl = t => t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  for(const raw of lines){ const l = raw.trim();
    if(/^[-•*]\s+/.test(l)){ if(!inList){ out += "<ul>"; inList = true; } out += "<li>"+inl(l.replace(/^[-•*]\s+/,""))+"</li>"; }

}

    offline:"Tidak bisa terhubung ke server Naiki. Periksa koneksi internet.",

    forbidden:"Server menolak permintaan dari alamat ini."})[code] || "Koneksi ke Naiki terputus. Coba kirim lagi.";
}
function rm(c){ const r = S.roadmaps[c.id]; return {rev: r ? r.rev : 0, ai: !!(r && r.ai), phases: r ? r.phases : template(c)}; }
function template(c){ return [
  {title:"Kelas XI", period:"Semester 3–4 · sekarang", tasks:[`Jaga nilai rapor stabil, terutama mapel pendukung ${c.majors[0]}`, `Pelajari dasar ${c.skill}`, `Ikut satu ekskul atau lomba di bidang ${c.field.toLowerCase()}`]},
  {title:"Kelas XII", period:"Semester 5–6", tasks:[`Selesaikan proyek kecil: ${c.proyek}`, `Pilih 3 prodi ${c.majors.join(" atau ")} di PTN incaran`, "Konsultasikan pilihan prodi dengan Guru BK"]},
  {title:"Seleksi masuk PTN", period:"Februari–Juli kelas XII", tasks:["Cek eligibilitas dan daftar SNBP", "Latihan soal TPS dan literasi untuk SNBT", "Siapkan jalur mandiri sebagai cadangan"]},
  {title:"Kuliah S1", period:"Sekitar 4 tahun", tasks:[`Magang di ${c.magang}`, `Ambil sertifikasi ${c.cert}`, "Bangun jaringan lewat organisasi dan alumni"]},
  {title:"Karier awal", period:"Setelah lulus", tasks:[`Lamar posisi ${c.entry}`, "Susun CV dan portofolio dari pengalaman kuliah"]}
];}
function tkey(c, rev, p, t){ return `${c.id}|${rev}|${p}|${t}`; }
function rmStats(c){ const r = rm(c); let total=0, done=0;
  r.phases.forEach((ph,p)=>ph.tasks.forEach((_,t)=>{ total++; if(S.checks[tkey(c,r.rev,p,t)]) done++; }));
  return {total, done, pct: total ? Math.round(done/total*100) : 0}; }
function xpInfo(){
  const st = rmStats(career(S.target)), chats = S.chatIsExample ? 0 : S.chat.filter(m=>m.role==="user").length;
  const xp = (S.assessed && !S.isExample?150:0) + st.done*40 + S.doneSessions*60 + S.viewed.length*10 + chats*5 + S.streak*5;
  return {xp, level: Math.floor(xp/300)+1, into: xp%300, st};
}

async function sendChat(text){
  text = (text||"").trim(); if(!text || UI.busy) return;
  if(S.chatIsExample){ S.chat = []; S.chatIsExample = false; }
  S.chat.push({role:"user",content:text}); const msg = {role:"assistant",content:"",pending:true}; S.chat.push(msg);
  UI.draft = ""; const inp = $("#chatInput"); if(inp){ inp.value = ""; inp.style.height = "auto"; } save(); paintMsgs();
  UI.busy = true; UI.ctl = new AbortController(); paintComposer();
  const hist = S.chat.slice(0,-1).filter(m=>m.content && m.content.trim()).slice(-12).map(m=>({role:m.role, content:m.content}));
  try{
    const d = await callNaiki({task:"chat", context:ctxPayload(), messages:hist}, UI.ctl.signal);
    msg.content = d.text || "";
    if(d.truncated) msg.note = "Jawaban terpotong. Minta Naiki melanjutkan.";
    if(aiState!=="on") setAI("on");
  }catch(e){
    const code = e && e.code;
    if(code!=="cancelled") msg.note = errCopy(code);
    if(code==="no_key") setAI("nokey"); else if(code==="offline") setAI("off");
  }finally{
    msg.pending = false; if(!msg.content && !msg.note) S.chat.pop();
    UI.busy = false; UI.ctl = null; save(); paintMsgs(); paintComposer();
  }
}

function hexSVG(sc){
  const R = 92, pt = (i,r)=>{ const a = (-90 + i*60)*Math.PI/180; return [r*Math.cos(a), r*Math.sin(a)]; };
  const ring = f => KEYS.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(",")).join(" ");
  const shape = KEYS.map((k,i)=>pt(i, R*Math.max(.04, sc[k]/100)).map(n=>n.toFixed(1)).join(",")).join(" ");
  let g = [.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" style="stroke:var(--line)" stroke-width="1"/>`).join("");
  g += KEYS.map((_,i)=>{ const [x,y] = pt(i,R); return `<line x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)"/>`; }).join("");
  g += `<polygon points="${shape}" style="fill:var(--violet);stroke:var(--violet)" fill-opacity=".18" stroke-width="2" stroke-linejoin="round"/>`;
  g += KEYS.map((k,i)=>{ const [x,y] = pt(i, R*Math.max(.04, sc[k]/100)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" style="fill:var(--violet)"/>`; }).join("");
  g += KEYS.map((k,i)=>{ const [x,y] = pt(i, R+20); return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" style="fill:var(--ink)">${k}</text>`; }).join("");
  return `<svg viewBox="-130 -128 260 256" role="img" aria-label="Heksagon minat RIASEC: ${KEYS.map(k=>k+" "+sc[k]+"%").join(", ")}">${g}</svg>`;
}

        <section class="card"><div class="card-h"><h2>Catatan sesi</h2><span class="note" id="noteSaved"></span></div>
          <label for="notesBox" class="sr">Catatan sesi</label><textarea class="notes" id="notesBox">${esc(S.notes)}</textarea>
          <p class="note" style="margin-top:8px">Tersimpan otomatis di browser ini.</p></section>
      </aside></div>`;
}
function openCall(){
  const nx = S.sessions[0], m = MENTORS.find(x=>x.id===nx.mentor); let sec = 0;
  $("#layer").innerHTML = `<div class="call" role="dialog" aria-modal="true" aria-label="Sesi video dengan ${m.name}">
    <div class="call-h"><div><b>${m.name}</b><br><small>${esc(nx.topic)} · simulasi ruang sesi</small></div><span class="mono" id="callTimer">00:00</span></div>
    <div class="tiles"><div class="tile"><span class="av grad">${m.init}</span><span>${m.name}</span></div><div class="tile"><span class="av">NP</span><span>Kamu</span></div></div>
    <div class="call-ctl">
      <button class="cbtn" aria-pressed="false" data-act="toggle" aria-label="Matikan mikrofon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="cbtn" aria-pressed="false" data-act="toggle" aria-label="Matikan kamera"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg></button>
      <button class="cbtn end" data-act="endCall" aria-label="Akhiri sesi"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-3.2 0-6.2.9-8.7 2.6-.6.4-.8 1.2-.4 1.8l1.4 2c.4.5 1.1.7 1.7.4l2.3-1.1c.5-.2.8-.7.8-1.2V12c1-.3 1.9-.4 2.9-.4s1.9.1 2.9.4v1.5c0 .5.3 1 .8 1.2l2.3 1.1c.6.3 1.3.1 1.7-.4l1.4-2c.4-.6.2-1.4-.4-1.8C18.2 9.9 15.2 9 12 9z"/></svg></button>
    </div></div>`;
  clearInterval(openCall._t);
  openCall._t = setInterval(()=>{ sec++; const t = $("#callTimer"); if(!t){ clearInterval(openCall._t); return; } t.textContent = String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"); },1000);
  $(".call .end").focus();
}

const BADGE_IC = {
  diri:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  langkah:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  jelajah:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  mentee:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c3 0 5 1.8 5 4.5"/>',
  separuh:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
  streak:'<path d="M12 21c4 0 7-2.7 7-6.5 0-4-3.5-6-4.5-10-2 1.5-3 3.5-3 5.5-1.2-.8-2-2-2.3-3.5C7.4 8.4 5 11 5 14.5 5 18.3 8 21 12 21z"/>'
};
function vProgress(){
  const x = xpInfo(), c = career(S.target), r = rm(c);
  const C = 2*Math.PI*56, off = C*(1 - x.into/300);
  const badges = [
    ["diri","Kenali Diri","Selesaikan asesmen", S.assessed && !S.isExample, S.isExample?"Asesmen belum dikerjakan":"Terbuka"],
    ["langkah","Langkah Pertama","Centang 1 tugas roadmap", x.st.done>=1, x.st.done>=1?"Terbuka":"0 dari 1"],
    ["jelajah","Penjelajah","Buka 5 profesi di direktori", S.viewed.length>=5, Math.min(S.viewed.length,5)+" dari 5"],
    ["mentee","Mentee Aktif","Ikut 1 sesi mentoring", S.doneSessions>=1, "Terbuka"],
    ["separuh","Separuh Jalan","Roadmap 50%", x.st.pct>=50, x.st.pct+"% dari 50%"],
    ["streak","Konsisten","Aktif 7 hari beruntun", S.streak>=7, S.streak+" dari 7 hari"]
  ];
  const W=560,H=190,L=34,B=26,T=12, maxV=60, bw=(W-L-10)/7;
  let ch = [0,20,40,60].map(v=>{ const y = T+(H-T-B)*(1-v/maxV); return `<line x1="${L}" x2="${W-6}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" style="fill:var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`; }).join("");
  ch += WEEK.map(([d,v],i)=>{ const h = (H-T-B)*(v/maxV), x0 = L+i*bw+bw*.22, y = H-B-h, today = i===WEEK.length-1;
    return `<rect x="${x0.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.56).toFixed(1)}" height="${Math.max(h,1.5).toFixed(1)}" rx="5" style="fill:${today?"var(--blue)":"var(--violet)"}" fill-opacity="${today?1:.55}"/>
    ${today?`<text x="${(x0+bw*.28).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--ink)" font-family="IBM Plex Mono, monospace">${v}</text>`:""}
    <text x="${(x0+bw*.28).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:${today?"var(--ink)":"var(--muted)"}" font-weight="${today?600:400}">${d}</text>`; }).join("");
  let nowIdx = r.phases.findIndex((ph,p)=>ph.tasks.some((_,t)=>!S.checks[tkey(c,r.rev,p,t)])); if(nowIdx<0) nowIdx = r.phases.length;
  return `<div class="grid g-2">
    <section class="card raised"><div class="card-h"><h2>Level kamu</h2><span class="pill info">${x.xp} XP</span></div>
      <div class="lvl"><div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6A35C8"/><stop offset="1" stop-color="#2950B8"/></linearGradient></defs>
        <circle cx="66" cy="66" r="56" fill="none" style="stroke:var(--sunk)" stroke-width="12"/><circle cx="66" cy="66" r="56" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
        <div class="in"><div><small class="muted">Level</small><b>${x.level}</b></div></div></div>
        <div class="minis"><div class="mini"><b>${S.streak} hari</b><small>Aktif beruntun</small></div><div class="mini"><b>${x.st.done}/${x.st.total}</b><small>Tugas roadmap</small></div>
          <div class="mini"><b>${S.doneSessions}</b><small>Sesi mentoring selesai</small></div><div class="mini"><b>${S.viewed.length}</b><small>Profesi dijelajahi</small></div></div></div>
      <p class="note" style="margin-top:14px">${300-x.into} XP lagi menuju level ${x.level+1}. Tugas roadmap memberi 40 XP, sesi mentoring 60 XP.</p></section>
    <section class="card chart"><div class="card-h"><h2>Aktivitas minggu ini</h2><span class="example-flag">Contoh data</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Menit belajar per hari: ${WEEK.map(w=>w[0]+" "+w[1]).join(", ")}">${ch}</svg>
      <p class="note">Menit di Naiki per hari. Total ${WEEK.reduce((a,w)=>a+w[1],0)} menit.</p></section>
  </div>
  <div class="grid g-2">
    <section class="card"><div class="card-h"><h2>Lencana</h2><span class="note">${badges.filter(b=>b[3]).length} dari ${badges.length} terbuka</span></div>
      <div class="badges">${badges.map(b=>`<div class="badge ${b[3]?"":"locked"}"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${BADGE_IC[b[0]]}</svg></span><b>${b[1]}</b><small>${b[3]?b[2]:b[4]}</small></div>`).join("")}</div></section>
    <section class="card"><div class="card-h"><h2>Tonggak roadmap</h2><button class="link" data-go="roadmap">Buka roadmap</button></div>
      <ul class="list">${r.phases.map((ph,p)=>`<li><span><b>${esc(ph.title)}</b><br><span class="note">${esc(ph.period)}</span></span><span class="pill ${p<nowIdx?"good":p===nowIdx?"info":"neutral"}">${p<nowIdx?"Selesai":p===nowIdx?"Berjalan":"Nanti"}</span></li>`).join("")}</ul>
      <p class="note" style="margin-top:10px">Target: ${c.name}</p></section>
  </div>`;
}

function vDirektori(){
  const sc = scores(S.answers), q = UI.search.trim().toLowerCase();
  let list = CAREERS.map(c=>({c, m:match(c,sc)})).filter(({c})=>(UI.field==="Semua"||c.field===UI.field) &&
    (!q || (c.name+" "+c.majors.join(" ")+" "+c.field).toLowerCase().includes(q)));
  if(UI.sort==="cocok") list.sort((a,b)=>b.m-a.m); else if(UI.sort==="az") list.sort((a,b)=>a.c.name.localeCompare(b.c.name,"id"));
  else list.sort((a,b)=>(a.c.outlook==="Tinggi"?0:1)-(b.c.outlook==="Tinggi"?0:1) || b.m-a.m);
  return `<div class="toolbar">
      <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <label for="dirSearch" class="sr">Cari profesi atau jurusan</label><input id="dirSearch" type="search" placeholder="Cari profesi atau jurusan, misal: gizi" value="${esc(UI.search)}"></div>
      <label class="note">Urutkan&nbsp; <select id="dirSort"><option value="cocok" ${UI.sort==="cocok"?"selected":""}>Paling cocok</option><option value="prospek" ${UI.sort==="prospek"?"selected":""}>Prospek tinggi</option><option value="az" ${UI.sort==="az"?"selected":""}>A–Z</option></select></label>
    </div>
    <div class="chips" role="group" aria-label="Bidang">${FIELDS.map(f=>`<button class="chip" aria-pressed="${UI.field===f}" data-act="field" data-f="${f}">${f}</button>`).join("")}</div>
    <p class="note" id="dirCount">${list.length} profesi · kode minatmu ${topCode(sc)}</p>
    <div class="cards">${list.map(({c,m})=>`<button class="ccard ${S.target===c.id?"is-target":""}" data-act="detail" data-id="${c.id}">
        <div class="h"><div><h3>${c.name}</h3><p class="meta">${c.field}</p></div>${codeHTML(c.code)}</div>
        <div><div style="display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:5px"><span class="muted">Kecocokan</span><b class="mono" style="color:var(--violet)">${m}%</b></div><div class="bar"><span style="width:${m}%"></span></div></div>
        <p class="meta">${c.majors.join(" · ")}</p>
        <div class="foot"><span class="mono">${c.salary==="bervariasi"?"Penghasilan bervariasi":"Rp "+c.salary+" jt/bln*"}</span><span class="pill ${c.outlook==="Tinggi"?"good":"neutral"}">Prospek ${c.outlook.toLowerCase()}</span></div>
      </button>`).join("") || `<p class="muted">Tidak ada profesi yang cocok dengan pencarian itu. Coba kata lain atau pilih bidang "Semua".</p>`}</div>
    <p class="note">* Kisaran gaji awal adalah perkiraan ilustratif untuk prototype, bukan data resmi. Kecocokan dihitung dari hasil asesmen.</p>`;
}
function openDetail(id){
  const c = career(id), sc = scores(S.answers);
  if(!S.viewed.includes(id)){ S.viewed.push(id); save(); }
  $("#layer").innerHTML = `<div class="drawer-bg" data-act="closeLayer"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><p class="eyebrow">${c.field}</p><h2 id="dTitle" style="font-size:1.6rem;margin-top:4px">${c.name}</h2></div>
        <button class="btn btn-g btn-s" data-act="closeLayer" id="dClose">Tutup</button></div>
      <p>${c.desc}</p>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${codeHTML(c.code)}<span class="note">${RIASEC[c.code[0]].id} + ${RIASEC[c.code[1]].id}</span><span class="pct">${match(c,sc)}% cocok</span></div>
      <dl><div><dt>Jurusan kuliah</dt><dd>${c.majors.join(", ")}</dd></div>
        <div><dt>Contoh PTN</dt><dd>${c.ptn.join(", ")}</dd></div>
        <div><dt>Mulai dari SMA</dt><dd>Pelajari ${c.skill}, lalu coba ${c.proyek}.</dd></div>
        <div><dt>Posisi awal</dt><dd>${c.entry}</dd></div>
        <div><dt>Perkiraan gaji awal*</dt><dd class="mono">${c.salary==="bervariasi"?"Bervariasi":"Rp "+c.salary+" juta per bulan"}</dd></div>
        <div><dt>Prospek</dt><dd><span class="pill ${c.outlook==="Tinggi"?"good":"neutral"}">${c.outlook}</span></dd></div></dl>
      <div class="chips">${S.target===c.id?`<span class="pill info">Sudah jadi target roadmap</span>`:`<button class="btn btn-p" data-act="setTarget" data-id="${c.id}" data-then="roadmap">Jadikan target roadmap</button>`}
        <button class="btn btn-g" data-act="askAbout" data-id="${c.id}">Tanya Naiki</button></div>
      <p class="note">* Perkiraan ilustratif untuk prototype.</p>
    </aside>`;
  $("#dClose").focus();
}
function closeLayer(){ $("#layer").innerHTML = ""; clearInterval(openCall._t); }

/* ---------- render ---------- */
function render(){
  const v = VIEWS.find(x=>x.id===UI.view);
  $("#nav").innerHTML = VIEWS.map((x,i)=>`<li><a href="#${x.id}" data-go="${x.id}" ${x.id===UI.view?'aria-current="page"':""}><span class="n">${i+1}</span><span class="t"><span>${x.label}</span><small>${x.cap}</small></span></a></li>`).join("");
  const body = {companion:vCompanion, asesmen:vAsesmen, roadmap:vRoadmap, guru:vGuru, mentoring:vMentoring, progress:vProgress, direktori:vDirektori}[v.id]();
  $("#view").innerHTML = header(v) + body;
  if(v.id==="companion"){ paintMsgs(); paintComposer(); }
  const cur = document.querySelector('.nav a[aria-current="page"]'); if(cur && window.innerWidth<=860) cur.scrollIntoView({block:"nearest",inline:"center"});
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]"); if(g){ e.preventDefault(); closeLayer(); go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if(!a) return; const act = a.dataset.act;
  if(act==="suggest"){ sendChat(a.dataset.q); }
  else if(act==="stop"){ e.preventDefault(); if(UI.ctl) UI.ctl.abort(); }
  else if(act==="clearChat"){ if(UI.busy && UI.ctl) UI.ctl.abort(); S.chat = []; S.chatIsExample = false; save(); paintMsgs(); }
  else if(act==="startTest"){ UI.taking = true; UI.q = 0; UI.tmp = []; render(); }
  else if(act==="quitTest"){ UI.taking = false; render(); }
  else if(act==="answer"){ UI.tmp[UI.q] = +a.dataset.v; render();
    if(UI.q < QUESTIONS.length-1){ clearTimeout(UI._adv); UI._adv = setTimeout(()=>{ if(UI.taking && UI.tmp[UI.q]){ UI.q++; render(); } },280); } }
  else if(act==="prevQ"){ clearTimeout(UI._adv); UI.q = Math.max(0,UI.q-1); render(); }
  else if(act==="nextQ"){ clearTimeout(UI._adv);
    if(UI.q < QUESTIONS.length-1){ UI.q++; render(); }
    else { S.answers = UI.tmp.slice(); S.assessed = true; S.isExample = false; UI.taking = false; save(); render(); window.scrollTo(0,0); toast("Asesmen selesai. +150 XP"); } }
  else if(act==="setTarget"){ S.target = a.dataset.id; save(); toast("Target roadmap: " + career(a.dataset.id).name); if(a.dataset.then){ closeLayer(); go(a.dataset.then); } else render(); }
  else if(act==="check"){ /* handled on change */ }
  else if(act==="personalize"){ personalize(); }
  else if(act==="resetRm"){ delete S.roadmaps[S.target]; save(); render(); }
  else if(act==="invite"){ toast("Undangan sesi BK dibuat untuk " + a.dataset.n + " (simulasi)"); }
  else if(act==="remind"){ toast("Pengingat dijadwalkan untuk 24 siswa (simulasi)"); }
  else if(act==="pick"){ UI.pick[a.dataset.m] = UI.pick[a.dataset.m]===a.dataset.s ? null : a.dataset.s; render(); }
  else if(act==="book"){ const m = MENTORS.find(x=>x.id===a.dataset.m), s = UI.pick[m.id]; if(!s) return;
    S.sessions.push({mentor:m.id, slot:s, topic:"Konsultasi karier", status:"Menunggu konfirmasi"}); UI.pick[m.id] = null; save(); render(); toast("Sesi diajukan ke " + m.name + " (simulasi)"); }
  else if(act==="join"){ openCall(); }
  else if(act==="toggle"){ a.setAttribute("aria-pressed", a.getAttribute("aria-pressed")==="true" ? "false" : "true"); }
  else if(act==="endCall"){ closeLayer(); toast("Sesi diakhiri. Jangan lupa isi catatan sesi."); }
  else if(act==="field"){ UI.field = a.dataset.f; render(); }
  else if(act==="detail"){ openDetail(a.dataset.id); }
  else if(act==="closeLayer"){ closeLayer(); }
  else if(act==="askAbout"){ const c = career(a.dataset.id); closeLayer(); UI.draft = `Ceritakan tentang profesi ${c.name}. Apa yang perlu aku siapkan dari sekarang?`; go("companion"); const t = $("#chatInput"); if(t){ t.focus(); } }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset && t.dataset.act==="check"){ if(t.checked) S.checks[t.dataset.k] = 1; else delete S.checks[t.dataset.k]; save(); if(t.checked) toast("Langkah selesai. +40 XP"); render(); }
  else if(t.id==="kelasSel"){ UI.kelas = t.value; render(); }
  else if(t.id==="dirSort"){ UI.sort = t.value; render(); }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.id==="dirSearch"){ UI.search = t.value; const pos = t.selectionStart; render(); const n = $("#dirSearch"); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} }
  else if(t.id==="notesBox"){ S.notes = t.value; clearTimeout(UI._n); UI._n = setTimeout(()=>{ save(); const s = $("#noteSaved"); if(s) s.textContent = "Tersimpan"; },500); }
  else if(t.id==="chatInput"){ UI.draft = t.value; t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight,140)+"px"; }
});
document.addEventListener("submit", e=>{ if(e.target.id==="chatForm"){ e.preventDefault(); sendChat($("#chatInput").value); } });
document.addEventListener("keydown", e=>{
  if(e.target.id==="chatInput" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendChat(e.target.value); }
  if(e.key==="Escape" && $("#layer").innerHTML){ closeLayer(); }
});

window.addEventListener("hashchange", ()=>{ const h = location.hash.slice(1); if(h!==UI.view && VIEWS.some(x=>x.id===h)) go(h); });
const h0 = (location.hash||"").slice(1); if(VIEWS.some(x=>x.id===h0)) UI.view = h0;
render();
</script>

</body>
</html>
